<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo: Sistema Nervoso</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse-slow {
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Container Principal / Card Central -->
    <div class="w-full max-w-2xl bg-slate-800 border border-slate-700/60 rounded-2xl shadow-2xl overflow-hidden relative">
        
        <!-- Decoração de Fundo Synapse/Brain -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header com Logo e Progresso (Oculto na Tela Inicial/Final) -->
        <header id="quiz-header" class="hidden p-6 border-b border-slate-700/50 bg-slate-800/80 backdrop-blur-md">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2 text-indigo-400 font-semibold text-sm uppercase tracking-wider">
                    <i class="fa-solid fa-brain text-lg"></i>
                    <span>Sistema Nervoso</span>
                </div>
                <span id="question-tracker" class="text-xs font-medium text-slate-400 bg-slate-700/60 px-3 py-1 rounded-full border border-slate-600/40">
                    Pergunta 1 de 7
                </span>
            </div>
            <!-- Barra de Progresso -->
            <div class="w-full bg-slate-700/50 h-2.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-cyan-400 h-full w-0 transition-all duration-500 ease-out"></div>
            </div>
        </header>

        <!-- TELA DE INÍCIO -->
        <div id="start-screen" class="p-8 sm:p-12 text-center fade-in">
            <div class="w-20 h-20 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-6 border border-indigo-500/20 pulse-slow">
                <i class="fa-solid fa-brain text-4xl"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white mb-4 tracking-tight">
                Desafio do Sistema Nervoso
            </h1>
            <p class="text-slate-300 text-base sm:text-lg mb-8 max-w-md mx-auto leading-relaxed">
                Teste seus conhecimentos sobre neurônios, sinapses, encéfalo e o funcionamento do comando central do corpo humano!
            </p>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-8 text-xs text-slate-400">
                <div class="flex items-center gap-2 bg-slate-700/30 px-3 py-2 rounded-lg border border-slate-700">
                    <i class="fa-solid fa-list-check text-indigo-400"></i>
                    <span>7 Perguntas</span>
                </div>
                <div class="flex items-center gap-2 bg-slate-700/30 px-3 py-2 rounded-lg border border-slate-700">
                    <i class="fa-solid fa-lightbulb text-amber-400"></i>
                    <span>Explicações Detalhadas</span>
                </div>
                <div class="flex items-center gap-2 bg-slate-700/30 px-3 py-2 rounded-lg border border-slate-700">
                    <i class="fa-solid fa-clock text-cyan-400"></i>
                    <span>Sem limite de tempo</span>
                </div>
            </div>
            <button onclick="startQuiz()" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 mx-auto">
                <span>Iniciar Quiz</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- CONTAINER DAS PERGUNTAS -->
        <div id="quiz-screen" class="hidden p-6 sm:p-8 fade-in">
            <!-- Enunciado -->
            <h2 id="question-text" class="text-xl sm:text-2xl font-bold text-white mb-6 leading-snug">
                <!-- Pergunta carregada via JS -->
            </h2>

            <!-- Opções de Resposta -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Opções carregadas via JS -->
            </div>

            <!-- Caixa de Feedback Educational -->
            <div id="feedback-box" class="hidden p-4 rounded-xl mb-6 transition-all border">
                <div class="flex items-start gap-3">
                    <div id="feedback-icon" class="text-xl mt-0.5"></div>
                    <div>
                        <h4 id="feedback-title" class="font-bold text-sm uppercase tracking-wide mb-1"></h4>
                        <p id="feedback-text" class="text-sm leading-relaxed opacity-90"></p>
                    </div>
                </div>
            </div>

            <!-- Botão Próxima Pergunta -->
            <div class="flex justify-end">
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition-all shadow-md flex items-center gap-2">
                    <span id="next-btn-text">Próxima Pergunta</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </div>

        <!-- TELA DE RESULTADO FINAL -->
        <div id="result-screen" class="hidden p-8 sm:p-12 text-center fade-in">
            <div id="score-badge" class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl font-extrabold border-4 shadow-xl">
                <!-- Score Icon/Badge -->
            </div>
            
            <h2 id="result-title" class="text-2xl sm:text-3xl font-bold text-white mb-2">
                <!-- Mensagem dinâmica -->
            </h2>
            
            <p id="result-description" class="text-slate-300 text-base mb-6 max-w-md mx-auto">
                <!-- Subtítulo dinâmico -->
            </p>

            <div class="bg-slate-700/40 border border-slate-700 p-4 rounded-xl mb-8 max-w-sm mx-auto flex justify-around items-center">
                <div class="text-center">
                    <span class="block text-xs text-slate-400 uppercase font-semibold">Pontuação</span>
                    <span id="score-text" class="text-2xl font-black text-indigo-400">0 / 7</span>
                </div>
                <div class="h-8 w-px bg-slate-600"></div>
                <div class="text-center">
                    <span class="block text-xs text-slate-400 uppercase font-semibold">Aproveitamento</span>
                    <span id="percentage-text" class="text-2xl font-black text-cyan-400">0%</span>
                </div>
            </div>

            <button onclick="restartQuiz()" class="px-8 py-3.5 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-xl border border-slate-600 transition-all flex items-center justify-center gap-2 mx-auto">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Tentar Novamente</span>
            </button>
        </div>

    </div>

    <!-- Lógica JavaScript -->
    <script>
        // Banco de Dados das 7 Perguntas
        const quizData = [
            {
                question: "Qual das alternativas a seguir descreve a principal divisão estrutural do Sistema Nervoso Humano?",
                options: [
                    "Sistema Nervoso Central (SNC) e Sistema Nervoso Periférico (SNP)",
                    "Sistema Nervoso Simpático e Sistema Nervoso Parassimpático",
                    "Cérebro, Cerebelo e Tronco Encefálico",
                    "Sistema Nervoso Somático e Sistema Nervoso Autônomo"
                ],
                correct: 0,
                explanation: "Anatomicamente, o Sistema Nervoso é dividido em Central (SNC - encéfalo e medula espinhal) e Periférico (SNP - nervos e gânglios)."
            },
            {
                question: "Qual é a estrutura do neurônio responsável por conduzir o impulso nervoso para FORA do corpo celular?",
                options: [
                    "Dendrito",
                    "Axônio",
                    "Bainha de Mielina",
                    "Sinapse"
                ],
                correct: 1,
                explanation: "O axônio transmite os impulsos elétricos para fora do corpo celular (sentido eferente), enquanto os dendritos recebem os sinais."
            },
            {
                question: "Qual parte do encéfalo é fundamental para a coordenação motora, equilíbrio e postura corporal?",
                options: [
                    "Hipotálamo",
                    "Córtex Cerebral",
                    "Cerebelo",
                    "Bulbo"
                ],
                correct: 2,
                explanation: "O cerebelo coordena os movimentos voluntários, ajusta a precisão e é o principal responsável pelo equilíbrio corporal."
            },
            {
                question: "A comunicação química entre dois neurônios ou entre um neurônio e um órgão efetor ocorre em qual estrutura?",
                options: [
                    "Sinapse",
                    "Nó de Ranvier",
                    "Corpo celular",
                    "Meninge"
                ],
                correct: 0,
                explanation: "Na sinapse química, os neurotransmissores são liberados na fenda sináptica para transmitir a informação ao próximo neurônio."
            },
            {
                question: "O Sistema Nervoso Autônomo divide-se em Simpático e Parassimpático. Qual é a principal função da divisão SIMPÁTICA?",
                options: [
                    "Estimular o repouso e a digestão de alimentos",
                    "Reduzir a frequência cardíaca e a pressão arterial",
                    "Preparar o organismo para situações de 'luta ou fuga' (estresse/alerta)",
                    "Controlar a contração dos músculos esqueléticos voluntários"
                ],
                correct: 2,
                explanation: "O sistema Simpático prepara o corpo para emergências/estresse (aumenta frequência cardíaca, dilata pupilas), enquanto o Parassimpático atua no repouso."
            },
            {
                question: "Qual estrutura do Tronco Encefálico controla funções vitais involuntárias, como o batimento cardíaco e a respiração?",
                options: [
                    "Bulbo (ou Medula Oblongata)",
                    "Cérebro",
                    "Espinha dorsal",
                    "Corpo caloso"
                ],
                correct: 0,
                explanation: "O bulbo abriga os centros de controle cardíaco e respiratório involuntários. Lesões nessa área são gravíssimas devido a essas funções vitais."
            },
            {
                question: "O que é um 'Arco Reflexo' e como ele funciona?",
                options: [
                    "Um pensamento complexo processado exclusivamente pelo córtex cerebral",
                    "Uma resposta involuntária e rápida a um estímulo, processada na medula antes de chegar ao cérebro",
                    "A condução elétrica contínua que ocorre sem neurotransmissores",
                    "O movimento voluntário de piscar os olhos deliberadamente"
                ],
                correct: 1,
                explanation: "O arco reflexo é uma resposta de defesa ultra-rápida. O sinal passa pela medula espinhal para gerar ação imediata, sem esperar pelo processamento consciente no cérebro."
            }
        ];

        // Estado do Quiz
        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        // Elementos DOM
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const quizHeader = document.getElementById('quiz-header');

        const questionTracker = document.getElementById('question-tracker');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');

        const feedbackBox = document.getElementById('feedback-box');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');

        const nextBtn = document.getElementById('next-btn');
        const nextBtnText = document.getElementById('next-btn-text');

        // Iniciar Quiz
        function startQuiz() {
            currentQuestion = 0;
            score = 0;
            answered = false;

            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            
            quizHeader.classList.remove('hidden');
            quizScreen.classList.remove('hidden');

            loadQuestion();
        }

        // Carregar Pergunta Atual
        function loadQuestion() {
            answered = false;
            const q = quizData[currentQuestion];

            // Atualizar Progresso
            questionTracker.innerText = `Pergunta ${currentQuestion + 1} de ${quizData.length}`;
            const progressPercent = ((currentQuestion + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Resetar UI de Feedback e Botão
            feedbackBox.classList.add('hidden');
            nextBtn.classList.add('hidden');
            
            // Texto da Pergunta
            questionText.innerText = q.question;

            // Renderizar Opções
            optionsContainer.innerHTML = '';
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-800/60 hover:bg-slate-700/80 hover:border-slate-500 transition-all flex items-center justify-between group cursor-pointer`;
                btn.onclick = () => selectOption(index);
                
                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-lg bg-slate-700 text-slate-300 group-hover:bg-indigo-600 group-hover:text-white flex items-center justify-center font-semibold text-sm transition-colors">
                            ${String.fromCharCode(65 + index)}
                        </span>
                        <span class="text-sm sm:text-base text-slate-200 font-medium">${option}</span>
                    </div>
                    <i class="fa-regular fa-circle text-slate-500 group-hover:text-slate-300 transition-colors option-icon"></i>
                `;
                optionsContainer.appendChild(btn);
            });
        }

        // Selecionar Opção
        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            const q = quizData[currentQuestion];
            const buttons = optionsContainer.children;

            // Verificar Acerto
            const isCorrect = selectedIndex === q.correct;
            if (isCorrect) score++;

            // Estilizar Botões
            for (let i = 0; i < buttons.length; i++) {
                const btn = buttons[i];
                btn.disabled = true;
                btn.classList.remove('hover:bg-slate-700/80', 'hover:border-slate-500', 'cursor-pointer');

                const icon = btn.querySelector('.option-icon');

                if (i === q.correct) {
                    // Opção Correta
                    btn.classList.add('bg-emerald-500/10', 'border-emerald-500', 'text-emerald-300');
                    btn.classList.remove('bg-slate-800/60', 'border-slate-700');
                    icon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
                } else if (i === selectedIndex && !isCorrect) {
                    // Seleção Incorreta
                    btn.classList.add('bg-rose-500/10', 'border-rose-500', 'text-rose-300');
                    btn.classList.remove('bg-slate-800/60', 'border-slate-700');
                    icon.className = "fa-solid fa-circle-xmark text-rose-400 text-lg";
                } else {
                    // Outras opções não selecionadas
                    btn.classList.add('opacity-40');
                }
            }

            // Exibir Feedback
            showFeedback(isCorrect, q.explanation);

            // Atualizar Botão Próximo
            if (currentQuestion === quizData.length - 1) {
                nextBtnText.innerText = "Ver Resultado";
            } else {
                nextBtnText.innerText = "Próxima Pergunta";
            }
            nextBtn.classList.remove('hidden');
        }

        // Mostrar Feedback Educativo
        function showFeedback(isCorrect, explanationText) {
            feedbackBox.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-200', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-200');

            if (isCorrect) {
                feedbackBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-200');
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i>`;
                feedbackTitle.innerText = "Excelente! Resposta Correta";
            } else {
                feedbackBox.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-200');
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-400"></i>`;
                feedbackTitle.innerText = "Incorreto";
            }

            feedbackText.innerText = explanationText;
        }

        // Avançar para a próxima pergunta ou tela final
        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Exibir Resultado Final
        function showResults() {
            quizScreen.classList.add('hidden');
            quizHeader.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const scoreBadge = document.getElementById('score-badge');
            const resultTitle = document.getElementById('result-title');
            const resultDescription = document.getElementById('result-description');
            const scoreText = document.getElementById('score-text');
            const percentageText = document.getElementById('percentage-text');

            const percentage = Math.round((score / quizData.length) * 100);

            scoreText.innerText = `${score} / ${quizData.length}`;
            percentageText.innerText = `${percentage}%`;

            if (score === 7) {
                scoreBadge.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl font-extrabold border-4 bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-emerald-500/20";
                scoreBadge.innerHTML = `<i class="fa-solid fa-award"></i>`;
                resultTitle.innerText = "Neurocientista de Elite!";
                resultDescription.innerText = "Impressionante! Você demonstrou domínio completo sobre a anatomia e a fisiologia do Sistema Nervoso.";
            } else if (score >= 4) {
                scoreBadge.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl font-extrabold border-4 bg-indigo-500/20 border-indigo-500 text-indigo-400 shadow-indigo-500/20";
                scoreBadge.innerHTML = `<i class="fa-solid fa-graduation-cap"></i>`;
                resultTitle.innerText = "Muito Bom!";
                resultDescription.innerText = "Você tem um ótimo conhecimento sobre o sistema nervoso. Com uma breve revisão, alcançará a pontuação máxima!";
            } else {
                scoreBadge.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl font-extrabold border-4 bg-amber-500/20 border-amber-500 text-amber-400 shadow-amber-500/20";
                scoreBadge.innerHTML = `<i class="fa-solid fa-book-open"></i>`;
                resultTitle.innerText = "Vale a pena revisar!";
                resultDescription.innerText = "O Sistema Nervoso é complexo, mas muito interessante. Leia as explicações e tente novamente para fixar o conteúdo!";
            }
        }

        // Reiniciar Quiz
        function restartQuiz() {
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
